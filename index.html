<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Flexihire Fleet Explorer for searching, filtering and comparing access equipment."
    >

    <meta
        name="theme-color"
        content="#f4b000"
    >

    <title>Flexihire Fleet Explorer</title>

    <link
        rel="manifest"
        href="manifest.json"
    >

    <link
        rel="icon"
        type="image/png"
        sizes="192x192"
        href="icons/icon-192.png"
    >

    <link
        rel="apple-touch-icon"
        href="icons/icon-192.png"
    >

    <link
        rel="stylesheet"
        href="styles.css"
    >
</head>


<body>


<!-- =========================================================
     HEADER
     ========================================================= -->

<header class="topbar">

    <div class="container">

        <a
            class="logo"
            href="#"
            aria-label="Flexihire Fleet Explorer home"
        >
            <img
                src="flexihire-logo.jpg"
                alt="Flexihire"
            >
        </a>


        <div class="header-content">

            <h1>
                Fleet Specification Explorer
            </h1>

            <p>
                Search, filter and compare access equipment
                across the Flexihire fleet.
            </p>

        </div>

    </div>

</header>


<!-- =========================================================
     APPLICATION
     ========================================================= -->

<main class="container app-layout">


    <!-- =====================================================
         SIDEBAR
         ===================================================== -->

    <aside
        class="sidebar"
        aria-label="Fleet filters"
    >


        <!-- Search -->

        <section class="sidebar-card">

            <h2>
                Search Fleet
            </h2>

            <input
                id="searchInput"
                type="text"
                placeholder="Search machine, model or manufacturer..."
                autocomplete="off"
            >

            <input
                id="heightInput"
                type="number"
                min="0"
                step="0.5"
                placeholder="Minimum height (m)"
            >

        </section>


        <!-- Categories -->

        <section class="sidebar-card">

            <h2>
                Machine Type
            </h2>

            <div id="categoryFilters">

                <!-- Generated by app.js -->

            </div>

        </section>


        <!-- Manufacturer filters are generated by app.js -->


        <!-- Environment -->

        <section class="sidebar-card">

            <h2>
                Environment
            </h2>

            <label class="filter-checkbox">

                <input
                    id="indoorFilter"
                    type="checkbox"
                >

                <span>
                    Indoor Suitable
                </span>

            </label>


            <label class="filter-checkbox">

                <input
                    id="outdoorFilter"
                    type="checkbox"
                >

                <span>
                    Outdoor Suitable
                </span>

            </label>

        </section>


        <!-- Sort -->

        <section class="sidebar-card">

            <h2>
                Sort Fleet
            </h2>

            <select
                id="sortSelect"
                aria-label="Sort machines"
            >

                <option value="name">
                    Name A–Z
                </option>

                <option value="name-desc">
                    Name Z–A
                </option>

                <option value="height-high">
                    Height: High to Low
                </option>

                <option value="height-low">
                    Height: Low to High
                </option>

                <option value="reach-high">
                    Reach: High to Low
                </option>

                <option value="reach-low">
                    Reach: Low to High
                </option>

                <option value="weight-high">
                    Weight: High to Low
                </option>

                <option value="weight-low">
                    Weight: Low to High
                </option>

            </select>

        </section>


        <!-- Filter Actions -->

        <section class="sidebar-card buttons">

            <button
                id="selectAll"
                type="button"
            >
                Select All
            </button>

            <button
                id="clearAll"
                class="secondary"
                type="button"
            >
                Reset Filters
            </button>

        </section>


    </aside>


    <!-- =====================================================
         MAIN CONTENT
         ===================================================== -->

    <section class="content">


        <!-- =================================================
             DASHBOARD
             ================================================= -->

        <section
            class="stats-bar"
            aria-label="Fleet summary"
        >


            <button
                class="stat"
                type="button"
                data-dashboard-filter="all"
            >

                <span id="totalFleetCount">
                    0
                </span>

                <label>
                    Total Fleet
                </label>

            </button>


            <button
                class="stat"
                type="button"
                data-dashboard-filter="Boom Lift"
            >

                <span id="boomLiftCount">
                    0
                </span>

                <label>
                    Boom Lifts
                </label>

            </button>


            <button
                class="stat"
                type="button"
                data-dashboard-filter="Scissor Lift"
            >

                <span id="scissorLiftCount">
                    0
                </span>

                <label>
                    Scissor Lifts
                </label>

            </button>


            <button
                class="stat"
                type="button"
                data-dashboard-filter="Trailer Boom"
            >

                <span id="trailerBoomCount">
                    0
                </span>

                <label>
                    Trailer Booms
                </label>

            </button>


            <button
                class="stat"
                type="button"
                data-dashboard-filter="Vertical Lift"
            >

                <span id="verticalLiftCount">
                    0
                </span>

                <label>
                    Vertical Lifts
                </label>

            </button>


            <button
                class="stat"
                type="button"
                id="favouritesDashboardButton"
            >

                <span id="favouriteCount">
                    0
                </span>

                <label>
                    Favourites
                </label>

            </button>


        </section>


        <!-- Compatibility counters used by app.js -->

        <div hidden>

            <span id="machineCount">
                0
            </span>

            <span id="categoryCount">
                0
            </span>

            <span id="comparisonCount">
                0
            </span>

        </div>


        <!-- =================================================
             FLEET GRID
             ================================================= -->

        <section
            id="fleetGrid"
            class="fleet-grid"
            aria-live="polite"
        >

            <!-- Machine cards generated by app.js -->

        </section>


    </section>


</main>


<!-- =========================================================
     FOOTER
     ========================================================= -->

<footer>

    <div class="container">

        Flexihire Fleet Explorer

    </div>

</footer>


<script src="app.js"></script>


</body>

</html>
